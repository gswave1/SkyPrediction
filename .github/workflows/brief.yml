name: Golden hour brief
on:
  schedule:
    # Every hour from 4 AM to 9 PM Eastern (cron is UTC)
    - cron: "0 8-23,0-1 * * *"
  workflow_dispatch:
  push:
    paths: ["index.html", "brief.mjs"]
permissions:
  contents: write
concurrency: { group: brief, cancel-in-progress: false }
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: node brief.mjs
      - name: Commit brief
        run: |
          git config user.name "golden-hour-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brief.txt brief.json road.txt
          git diff --cached --quiet || (git commit -m "Update brief" && git push)
