name: Golden hour brief
on:
  schedule:
    # Every hour from 4 AM to 9 PM Eastern (cron is UTC)
    - cron: "0 8-23,0-1 * * *"
  workflow_dispatch:
  push:
    paths: ["index.html", "brief.mjs", "box-upload.mjs", "stamp.mjs"]
permissions:
  contents: write
concurrency: { group: brief, cancel-in-progress: false }
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Stamp the board's build time (only when index.html changed)
        run: node stamp.mjs
      - run: node brief.mjs
      - name: Commit brief
        run: |
          git config user.name "golden-hour-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brief.txt brief.json road.txt README.md index.html .build-hash
          git diff --cached --quiet || (git commit -m "Update brief" && git push)
      - name: Keep the full run (raw model data + analysis) as a run artifact
        if: always() && hashFiles('out/run.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: "run-${{ github.run_id }}", path: out, retention-days: 30 }
      - name: Upload the full run to Box (Photography/Apps/SkyPrediction)
        if: hashFiles('out/run.json') != ''
        env:
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
          BOX_USER_ID: ${{ secrets.BOX_USER_ID }}
        run: node box-upload.mjs
